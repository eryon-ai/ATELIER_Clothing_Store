services:
  # Vite Frontend React Application
  frontend:
    build: .
    container_name: atelier_frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - db

  # PostgreSQL Database for Backend Schema
  db:
    image: postgres:16-alpine
    container_name: atelier_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: atelier_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
